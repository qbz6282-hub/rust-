[package]
name = "coding_tools"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
bytes = "1.12.1"
eframe = { version = "0.37", default-features = false, features = ["glow", "clipboard", "default_fonts", "x11", "wayland"] }
egui = "0.37"
